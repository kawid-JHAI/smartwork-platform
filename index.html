<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국장애인복지시설협회 스마트워크 플랫폼</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./favicon.png" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2f3ff;color:#1e293b;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
    .wrap{max-width:560px;margin:0 auto;padding:40px 16px 56px;text-align:center}
    .wrap img{height:44px;max-width:80%;object-fit:contain}
    h1{font-size:20px;color:#00236f;margin:24px 0 8px}p{font-size:14px;line-height:1.7;color:#475569;margin:0 0 24px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:16px 4px;background:#fff;border:1px solid #e2e8f0;color:#00236f;text-decoration:none;font-weight:700;font-size:16px}
    .btn span{font-size:11px;font-weight:500;color:#64748b}.btn:hover,.btn:active{background:#00236f;color:#fff}.btn:hover span,.btn:active span{color:#dbe1ff}
    footer{margin-top:32px;font-size:12px;color:#94a3b8}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="./ci-full.png" alt="한국장애인복지시설협회" />
    <h1>스마트워크 플랫폼</h1>
    <p>이용하실 시도협회를 선택해 주세요.</p>
    <div class="grid">
      <a class="btn" href="./seoul/">서울<span>협회</span></a>
      <a class="btn" href="./busan/">부산<span>협회</span></a>
      <a class="btn" href="./daegu/">대구<span>협회</span></a>
      <a class="btn" href="./incheon/">인천<span>협회</span></a>
      <a class="btn" href="./gwangju/">광주<span>협회</span></a>
      <a class="btn" href="./daejeon/">대전<span>협회</span></a>
      <a class="btn" href="./ulsan/">울산<span>협회</span></a>
      <a class="btn" href="./sejong/">세종<span>협회</span></a>
      <a class="btn" href="./gyeonggi/">경기<span>협회</span></a>
      <a class="btn" href="./gangwon/">강원<span>협회</span></a>
      <a class="btn" href="./chungbuk/">충북<span>협회</span></a>
      <a class="btn" href="./chungnam/">충남<span>협회</span></a>
      <a class="btn" href="./jeonbuk/">전북<span>협회</span></a>

      <a class="btn" href="./jeju/">제주<span>협회</span></a>
    </div>
    <footer>© 한국장애인복지시설협회</footer>
  </div>
</body>
</html>
